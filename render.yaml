# Render Blueprint — deploys the FastAPI backend and the static React frontend
# together. In the Render dashboard: New > Blueprint > select this repo.
# The only value you must supply by hand is ANTHROPIC_API_KEY.
services:
  - type: web
    name: nutrichef-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard, never committed
      - key: PYTHON_VERSION
        value: "3.12.10" # pydantic 2.5.x has no prebuilt wheels for 3.13

  - type: web
    name: nutrichef
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: nutrichef-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
