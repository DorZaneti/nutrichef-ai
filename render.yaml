# Render Blueprint — single service: the FastAPI backend also serves the
# committed frontend build (frontend/dist). The only value you must supply
# by hand is ANTHROPIC_API_KEY.
services:
  - type: web
    name: nutrichef-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard, never committed
      - key: PYTHON_VERSION
        value: "3.12.10" # pydantic 2.5.x has no prebuilt wheels for 3.13
